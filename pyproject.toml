[project]
name = "random-prizes-back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "aiobotocore>=2.21.0",
    "alembic>=1.14.1",
    "fastapi>=0.115.10",
    "loguru>=0.7.3",
    "pydantic[email] (>=2.11.3,<3.0.0)",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.38",
    "uvicorn>=0.34.0",
    "alembic (>=1.15.1,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.4.0,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "argon2-cffi (>=23.1.0,<24.0.0)",
    "certifi (>=2025.1.31,<2026.0.0)",
    "bcrypt == 4.0.1",
    "pydantic-extra-types[pendulum]>=2.10.5",
    "phonenumbers>=9.0.7",
    "flake8>=7.3.0"
]

[tool.ruff]
line-length = 120

exclude = ["venv", "migrations", "app/tests"]

target-version = "py310"

lint.select = [
    "E",
    "F",
    "I",
    "W",
    "B",
    "C4",
    "N",
]

lint.ignore = ["E203", "E711", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/enums/prompt_templates.py" = ["W291", "W293", "E501"]

[tool.ruff.lint.isort]
known-first-party = []
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
exclude = "(venv|migrations|app/tests)/"
plugins = ["pydantic.mypy"]
strict_optional = true
check_untyped_defs = true
warn_redundant_casts = true
disable_error_code = ["str-format", "import-untyped", "assignment"]
disallow_untyped_calls = true
disallow_untyped_defs = true
warn_incomplete_stub = true
ignore_missing_imports = true
no_implicit_optional = true
warn_no_return = false
